name: Gateway Compat

# Validates the tray <-> openclaw gateway integration so a gateway release
# can't silently break us.
#
# Layout (informed by W0 spike findings, run 26138294682):
#   PR / push -> Smoke job only. Builds the E2E tray (with test hooks),
#                runs the harness Smoke tier. Fast (~3 min). Merge-gating.
#   Nightly   -> Smoke + Gateway tier. Installs WSL + Ubuntu-24.04 +
#                openclaw + fake-LLM, runs all scenarios. Matrix tests both
#                the pinned LKG version and the current "latest" published
#                gateway, so we get early warning when upstream breaks us.
#                Failures on "latest" do NOT gate merges (alert-only).

on:
  push:
    branches: [ master, main ]
    paths:
      - "src/OpenClaw.Tray.WinUI/Services/TestHooks/**"
      - "src/OpenClaw.Tray.WinUI/Services/NodeService.cs"
      - "src/OpenClaw.Tray.WinUI/Services/LocalGatewaySetup/**"
      - "tests/OpenClaw.GatewayCompat.E2ETests/**"
      - "tools/fake-llm-server/**"
      - "tools/spike/**"
      - "gateway-lkg.json"
      - "src/OpenClaw.Shared/GatewayLkg.cs"
      - ".github/workflows/gateway-compat.yml"
  pull_request:
    paths:
      - "src/OpenClaw.Tray.WinUI/Services/TestHooks/**"
      - "src/OpenClaw.Tray.WinUI/Services/NodeService.cs"
      - "src/OpenClaw.Tray.WinUI/Services/LocalGatewaySetup/**"
      - "tests/OpenClaw.GatewayCompat.E2ETests/**"
      - "tools/fake-llm-server/**"
      - "tools/spike/**"
      - "gateway-lkg.json"
      - "src/OpenClaw.Shared/GatewayLkg.cs"
      - ".github/workflows/gateway-compat.yml"
  schedule:
    # Nightly at 07:00 UTC (midnight Pacific). Runs the full matrix
    # (LKG + latest) to catch upstream breakage early.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      gateway_version:
        description: openclaw npm version or dist-tag to install for the gateway tier
        required: false
        default: ""
        type: string
      run_gateway_tier:
        description: Run the full gateway tier (WSL + openclaw + fake LLM)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      gateway_version:
        description: openclaw npm version or dist-tag to install for the gateway tier
        required: false
        default: ""
        type: string
      run_gateway_tier:
        description: Run the full gateway tier
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gateway-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Harness smoke (no WSL)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build E2E tray (with test hooks)
        # Production tray binaries must NEVER have this flag (enforced by
        # OpenClaw.Tray.Tests.ReleaseBuildExcludesTestHooksTests). This is a
        # dedicated E2E build that lives in its own bin subtree and is used
        # ONLY by this job.
        run: dotnet build src/OpenClaw.Tray.WinUI -c Debug -r win-x64 -p:OpenClawEnableTestHooks=true --no-restore

      - name: Build gateway-compat harness
        run: dotnet build tests/OpenClaw.GatewayCompat.E2ETests -c Debug --no-restore

      - name: Run Smoke tier
        run: >
          dotnet test tests/OpenClaw.GatewayCompat.E2ETests
          --no-build
          -c Debug
          --filter "Tier=Smoke"
          --verbosity normal
          --logger "trx;LogFileName=GatewayCompat.Smoke.trx"
          --results-directory TestResults/Smoke

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-compat-smoke-results
          path: TestResults/Smoke
          if-no-files-found: warn

  gateway:
    name: Gateway tier (WSL + openclaw@${{ matrix.gateway_version }})
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_gateway_tier == true)
    needs: smoke
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # LKG: the pinned version users actually get. Failure here gates merges.
        # latest: alert-only signal of upcoming breakage. continue-on-error
        # below makes "latest" failures visible but non-blocking.
        gateway_version: [lkg, latest]
        include:
          - gateway_version: lkg
            failure_is_blocking: true
          - gateway_version: latest
            failure_is_blocking: false
    continue-on-error: ${{ !matrix.failure_is_blocking }}
    env:
      FAKE_LLM_PORT: "18888"
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve gateway version
        id: ver
        shell: pwsh
        run: |
          # LKG version comes from gateway-lkg.json (source of truth for tooling).
          # Dispatch override wins; matrix "lkg" -> read JSON; "latest" -> "latest".
          $override = "${{ inputs.gateway_version }}"
          $resolved = $override
          if (-not $resolved) {
            if ('${{ matrix.gateway_version }}' -eq 'lkg') {
              $lkg = (Get-Content gateway-lkg.json -Raw | ConvertFrom-Json).version
              $resolved = $lkg
            } else {
              $resolved = 'latest'
            }
          }
          Write-Host "Gateway version under test: $resolved"
          "version=$resolved" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build E2E tray (with test hooks)
        run: dotnet build src/OpenClaw.Tray.WinUI -c Debug -r win-x64 -p:OpenClawEnableTestHooks=true --no-restore

      - name: Build gateway-compat harness
        run: dotnet build tests/OpenClaw.GatewayCompat.E2ETests -c Debug --no-restore

      - name: Register WSL path helper (pwsh)
        # Same helper the spike uses. Converts C:\foo\bar -> /mnt/c/foo/bar
        # so workflow steps can hand Windows paths to bash inside WSL.
        shell: pwsh
        run: |
          $helper = @'
          function global:ConvertTo-WslPath([string]$path) {
            $p = ($path -replace '\\','/').TrimEnd('/')
            if ($p -match '^([A-Za-z]):/(.*)$') {
              return "/mnt/" + $matches[1].ToLower() + "/" + $matches[2]
            }
            return $p
          }
          '@
          $profileDir = Split-Path -Parent $PROFILE.CurrentUserAllHosts
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          $helper | Out-File -FilePath $PROFILE.CurrentUserAllHosts -Encoding utf8 -Append

      - name: Install Ubuntu-24.04 distro
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          wsl --install Ubuntu-24.04 --no-launch --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --install failed with $LASTEXITCODE" }
          wsl --list --verbose

      - name: Provision openclaw user
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $script = ConvertTo-WslPath (Join-Path $env:GITHUB_WORKSPACE "tools/spike/provision.sh")
          wsl -d Ubuntu-24.04 -u root -- bash -lc "bash $script"
          if ($LASTEXITCODE -ne 0) { throw "provision failed with $LASTEXITCODE" }

      - name: Install openclaw@${{ steps.ver.outputs.version }}
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $version = "${{ steps.ver.outputs.version }}"
          $cmd = "curl -fsSL --proto '=https' --tlsv1.2 'https://openclaw.ai/install-cli.sh' | " +
                 "OPENCLAW_PREFIX='/opt/openclaw' OPENCLAW_INSTALL_METHOD='npm' OPENCLAW_VERSION='$version' " +
                 "SHARP_IGNORE_GLOBAL_LIBVIPS=1 bash -s -- --json --prefix '/opt/openclaw' --version '$version' --no-onboard"
          wsl -d Ubuntu-24.04 -u openclaw -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw "openclaw install failed with $LASTEXITCODE" }
          wsl -d Ubuntu-24.04 -u openclaw -- /opt/openclaw/bin/openclaw --version

      - name: Start fake LLM server inside WSL
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $script = ConvertTo-WslPath (Join-Path $env:GITHUB_WORKSPACE "tools/spike/start-fake-llm.sh")
          $repoWsl = ConvertTo-WslPath $env:GITHUB_WORKSPACE
          $port = $env:FAKE_LLM_PORT
          wsl -d Ubuntu-24.04 -u openclaw -- bash -lc "REPO_WSL_PATH='$repoWsl' FAKE_LLM_PORT='$port' bash $script"
          if ($LASTEXITCODE -ne 0) { throw "fake-llm bring-up failed with $LASTEXITCODE" }

      - name: Run Gateway tier
        env:
          OPENCLAW_RUN_GATEWAY_COMPAT: "1"
          OPENCLAW_GATEWAY_VERSION: ${{ steps.ver.outputs.version }}
          FAKE_LLM_PORT: ${{ env.FAKE_LLM_PORT }}
        run: >
          dotnet test tests/OpenClaw.GatewayCompat.E2ETests
          --no-build
          -c Debug
          --filter "Tier=Gateway|Tier=Smoke"
          --verbosity normal
          --logger "trx;LogFileName=GatewayCompat.Gateway.${{ matrix.gateway_version }}.trx"
          --results-directory TestResults/Gateway-${{ matrix.gateway_version }}

      - name: Collect WSL gateway log
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Path TestResults/Gateway-${{ matrix.gateway_version }}/logs -Force | Out-Null
          wsl -d Ubuntu-24.04 -u openclaw -- cat /home/openclaw/fake-llm/server.log > TestResults/Gateway-${{ matrix.gateway_version }}/logs/fake-llm.log

      - name: Upload gateway-tier results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-compat-${{ matrix.gateway_version }}-results
          path: TestResults/Gateway-${{ matrix.gateway_version }}
          if-no-files-found: warn

      - name: Cleanup WSL distro
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          wsl --shutdown
          wsl --unregister Ubuntu-24.04
