name: Gateway Compat

# Validates the tray <-> openclaw gateway integration so a gateway release
# can't silently break us.
#
# Layout (informed by W0 spike findings, run 26138294682):
#   PR / push -> Smoke job only. Builds the E2E tray (with test hooks),
#                runs the harness Smoke tier. Fast (~3 min). Merge-gating.
#   Nightly   -> Smoke + Gateway tier. Installs WSL + Ubuntu-24.04 +
#                openclaw + fake-LLM, runs all scenarios. Matrix tests both
#                the pinned LKG version and the current "latest" published
#                gateway, so we get early warning when upstream breaks us.
#                Failures on "latest" do NOT gate merges (alert-only).

on:
  push:
    branches: [ master, main ]
    paths:
      - "src/OpenClaw.Tray.WinUI/Services/TestHooks/**"
      - "src/OpenClaw.Tray.WinUI/Services/NodeService.cs"
      - "src/OpenClaw.Tray.WinUI/Services/LocalGatewaySetup/**"
      - "tests/OpenClaw.GatewayCompat.E2ETests/**"
      - "tools/fake-llm-server/**"
      - "tools/spike/**"
      - "gateway-lkg.json"
      - "src/OpenClaw.Shared/GatewayLkg.cs"
      - ".github/workflows/gateway-compat.yml"
  pull_request:
    paths:
      - "src/OpenClaw.Tray.WinUI/Services/TestHooks/**"
      - "src/OpenClaw.Tray.WinUI/Services/NodeService.cs"
      - "src/OpenClaw.Tray.WinUI/Services/LocalGatewaySetup/**"
      - "tests/OpenClaw.GatewayCompat.E2ETests/**"
      - "tools/fake-llm-server/**"
      - "tools/spike/**"
      - "gateway-lkg.json"
      - "src/OpenClaw.Shared/GatewayLkg.cs"
      - ".github/workflows/gateway-compat.yml"
  schedule:
    # Nightly at 07:00 UTC (midnight Pacific). Runs the full matrix
    # (LKG + latest) to catch upstream breakage early.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      gateway_version:
        description: openclaw npm version or dist-tag to install for the gateway tier
        required: false
        default: ""
        type: string
      run_gateway_tier:
        description: Run the full gateway tier (WSL + openclaw + fake LLM)
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      gateway_version:
        description: openclaw npm version or dist-tag to install for the gateway tier
        required: false
        default: ""
        type: string
      run_gateway_tier:
        description: Run the full gateway tier
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gateway-compat-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Harness smoke (no WSL)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build E2E tray (with test hooks)
        # Production tray binaries must NEVER have this flag (enforced by
        # OpenClaw.Tray.Tests.ReleaseBuildExcludesTestHooksTests). This is a
        # dedicated E2E build that lives in its own bin subtree and is used
        # ONLY by this job.
        # Omit --no-restore so the RID-targeted restore generates the right
        # win-x64 assets for the dependent WinUI projects (matches existing
        # ci.yml pattern for "Build Tray App (WinUI)").
        run: dotnet build src/OpenClaw.Tray.WinUI -c Debug -r win-x64 -p:OpenClawEnableTestHooks=true

      - name: Build gateway-compat harness
        run: dotnet build tests/OpenClaw.GatewayCompat.E2ETests -c Debug --no-restore

      - name: Run Smoke tier
        run: >
          dotnet test tests/OpenClaw.GatewayCompat.E2ETests
          --no-build
          -c Debug
          --filter "Tier=Smoke"
          --verbosity normal
          --logger "trx;LogFileName=GatewayCompat.Smoke.trx"
          --results-directory TestResults/Smoke

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-compat-smoke-results
          path: TestResults/Smoke
          if-no-files-found: warn

  gateway:
    name: Gateway tier (WSL + openclaw@${{ matrix.gateway_version }})
    # PR/push: LKG matrix cell runs as merge gate (~3 min added latency,
    # catches gateway regressions before merge).
    # Nightly: full matrix (LKG + latest); "latest" failures alert-only.
    # workflow_dispatch: only when run_gateway_tier=true.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_gateway_tier == true)
    needs: smoke
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gateway_version: ${{ fromJson((github.event_name == 'pull_request' || github.event_name == 'push') && '["lkg"]' || '["lkg","latest"]') }}
        include:
          - gateway_version: lkg
            failure_is_blocking: true
          - gateway_version: latest
            failure_is_blocking: false
    continue-on-error: ${{ !matrix.failure_is_blocking }}
    env:
      FAKE_LLM_PORT: "18888"
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve gateway version
        id: ver
        shell: pwsh
        run: |
          # LKG version comes from gateway-lkg.json (source of truth for tooling).
          # Dispatch override wins; matrix "lkg" -> read JSON; "latest" -> "latest".
          $override = "${{ inputs.gateway_version }}"
          $resolved = $override
          if (-not $resolved) {
            if ('${{ matrix.gateway_version }}' -eq 'lkg') {
              $lkg = (Get-Content gateway-lkg.json -Raw | ConvertFrom-Json).version
              $resolved = $lkg
            } else {
              $resolved = 'latest'
            }
          }
          Write-Host "Gateway version under test: $resolved"
          "version=$resolved" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build E2E tray (with test hooks)
        # Omit --no-restore to trigger RID-targeted restore for WinUI deps.
        run: dotnet build src/OpenClaw.Tray.WinUI -c Debug -r win-x64 -p:OpenClawEnableTestHooks=true

      - name: Build gateway-compat harness
        run: dotnet build tests/OpenClaw.GatewayCompat.E2ETests -c Debug --no-restore

      - name: Register WSL path helper (pwsh)
        # Same helper the spike uses. Converts C:\foo\bar -> /mnt/c/foo/bar
        # so workflow steps can hand Windows paths to bash inside WSL.
        # Plan A: install + fake-LLM bring-up are now driven from inside the
        # gateway-compat scenarios themselves (via tray.testhook.localSetup.start
        # + GatewayCollectionFixture). This step + the diagnostics one below
        # remain to make CI logs useful when the fixture fails.
        shell: pwsh
        run: |
          $helper = @'
          function global:ConvertTo-WslPath([string]$path) {
            $p = ($path -replace '\\','/').TrimEnd('/')
            if ($p -match '^([A-Za-z]):/(.*)$') {
              return "/mnt/" + $matches[1].ToLower() + "/" + $matches[2]
            }
            return $p
          }
          '@
          $profileDir = Split-Path -Parent $PROFILE.CurrentUserAllHosts
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          $helper | Out-File -FilePath $PROFILE.CurrentUserAllHosts -Encoding utf8 -Append

      - name: WSL host diagnostics
        # Plan A: the scenarios install WSL + openclaw themselves via the
        # production tray.testhook.localSetup.start path. We log the host's
        # WSL state so failures in that flow are diagnosable from CI logs.
        shell: pwsh
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          wsl --version
          wsl --status
          wsl --list --verbose
          wsl --list --online

      - name: Run Gateway tier
        env:
          OPENCLAW_RUN_GATEWAY_COMPAT: "1"
          OPENCLAW_GATEWAY_VERSION: ${{ steps.ver.outputs.version }}
          FAKE_LLM_PORT: ${{ env.FAKE_LLM_PORT }}
        run: >
          dotnet test tests/OpenClaw.GatewayCompat.E2ETests
          --no-build
          -c Debug
          --filter "Tier=Gateway|Tier=Smoke"
          --verbosity normal
          --logger "trx;LogFileName=GatewayCompat.Gateway.${{ matrix.gateway_version }}.trx"
          --results-directory TestResults/Gateway-${{ matrix.gateway_version }}

      - name: Collect WSL gateway log
        # The collection fixture provisions the OpenClawGateway distro
        # (production default) via tray.testhook.localSetup.start, then
        # bootstraps fake-LLM inside it. Log path mirrors the production
        # install layout.
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $logDir = "TestResults/Gateway-${{ matrix.gateway_version }}/logs"
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          wsl --list --verbose | Out-File -Encoding utf8 "$logDir/wsl-list.log"
          wsl -d OpenClawGateway -u openclaw -- cat /home/openclaw/fake-llm/server.log > "$logDir/fake-llm.log" 2>&1
          wsl -d OpenClawGateway -u openclaw -- bash -lc "ls -la /home/openclaw /opt/openclaw 2>&1 || true" > "$logDir/distro-layout.log" 2>&1

      - name: Upload gateway-tier results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-compat-${{ matrix.gateway_version }}-results
          path: TestResults/Gateway-${{ matrix.gateway_version }}
          if-no-files-found: warn

      - name: Cleanup WSL distro
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          wsl --shutdown
          # Production distro name; the scenarios install (and we tear down)
          # the same one a real user would see.
          wsl --unregister OpenClawGateway
