name: Gateway Compat Spike (W0)

# Throwaway diagnostic workflow that proves the WSL + openclaw + fake-LLM
# pipeline works on a hosted Windows runner before we invest in a full
# gateway-compat harness. Manual dispatch only. Outputs cold-start timings,
# `openclaw config validate` results, and a fake-LLM round-trip so we can
# size the real CI plan. Delete this file (or fold into gateway-compat.yml)
# once the findings are baked into the harness.

on:
  workflow_dispatch:
    inputs:
      gateway_version:
        description: openclaw npm version or dist-tag to install
        required: false
        default: latest
        type: string

permissions:
  contents: read

jobs:
  spike:
    name: WSL + openclaw + fake LLM
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OPENCLAW_GATEWAY_VERSION: ${{ inputs.gateway_version }}
      FAKE_LLM_PORT: "18888"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Register WSL path helper (pwsh)
        shell: pwsh
        # PowerShell function that converts C:\foo\bar -> /mnt/c/foo/bar. Used by
        # every subsequent step that needs to hand a Windows path to a WSL command.
        run: |
          $helper = @'
          function global:ConvertTo-WslPath([string]$path) {
            $p = ($path -replace '\\','/').TrimEnd('/')
            if ($p -match '^([A-Za-z]):/(.*)$') {
              return "/mnt/" + $matches[1].ToLower() + "/" + $matches[2]
            }
            return $p
          }
          '@
          $profileDir = Split-Path -Parent $PROFILE.CurrentUserAllHosts
          New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
          $helper | Out-File -FilePath $PROFILE.CurrentUserAllHosts -Encoding utf8 -Append
          Write-Host "Wrote ConvertTo-WslPath helper to $($PROFILE.CurrentUserAllHosts)"

      - name: WSL host diagnostics
        shell: pwsh
        # Diagnostic step only; never fail the job here. WSL commands that
        # return non-zero (e.g. `wsl --list --verbose` when no distros are
        # registered) are expected on a fresh runner and are themselves data.
        continue-on-error: true
        run: |
          # wsl.exe emits UTF-16 LE; decode it so the log is readable.
          [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          function Run-Diagnostic($label, [ScriptBlock]$body) {
            Write-Host "::group::$label"
            try { & $body | Out-Host } catch { Write-Host "(error: $($_.Exception.Message))" }
            Write-Host "(exit=$LASTEXITCODE)"
            $global:LASTEXITCODE = 0
            Write-Host "::endgroup::"
          }
          Run-Diagnostic "wsl --version" { wsl --version }
          Run-Diagnostic "wsl --status" { wsl --status }
          Run-Diagnostic "wsl --list --verbose" { wsl --list --verbose }
          Run-Diagnostic "wsl --list --online" { wsl --list --online }
          $sw.Stop()
          "wsl_diagnostics_seconds=$([math]::Round($sw.Elapsed.TotalSeconds,1))" | Out-File -Append $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
        id: diag

      - name: Install Ubuntu-24.04 distro
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::Unicode
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          # Match the production install command used by LocalGatewaySetup:
          #   wsl --install Ubuntu-24.04 --name OpenClawGateway --no-launch --version 2
          # Use default name 'Ubuntu-24.04' for the spike to avoid the rename codepath.
          wsl --install Ubuntu-24.04 --no-launch --version 2
          if ($LASTEXITCODE -ne 0) { throw "wsl --install failed with $LASTEXITCODE" }
          $sw.Stop()
          Write-Host "Distro install: $([math]::Round($sw.Elapsed.TotalSeconds,1))s"
          wsl --list --verbose

      - name: Provision openclaw user inside distro
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $script = ConvertTo-WslPath (Join-Path $env:GITHUB_WORKSPACE "tools/spike/provision.sh")
          wsl -d Ubuntu-24.04 -u root -- bash -lc "bash $script"
          if ($LASTEXITCODE -ne 0) { throw "openclaw user provision failed with $LASTEXITCODE" }

      - name: Install openclaw gateway (mirrors LocalGatewaySetup)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $version = $env:OPENCLAW_GATEWAY_VERSION
          if (-not $version) { $version = "latest" }
          Write-Host "Installing openclaw@$version via install-cli.sh"
          # Inline command is safe (no embedded scripts, just shell flags).
          $cmd = "curl -fsSL --proto '=https' --tlsv1.2 'https://openclaw.ai/install-cli.sh' | " +
                 "OPENCLAW_PREFIX='/opt/openclaw' OPENCLAW_INSTALL_METHOD='npm' OPENCLAW_VERSION='$version' " +
                 "SHARP_IGNORE_GLOBAL_LIBVIPS=1 bash -s -- --json --prefix '/opt/openclaw' --version '$version' --no-onboard"
          wsl -d Ubuntu-24.04 -u openclaw -- bash -lc $cmd
          if ($LASTEXITCODE -ne 0) { throw "openclaw install failed with $LASTEXITCODE" }
          $sw.Stop()
          Write-Host "Gateway install: $([math]::Round($sw.Elapsed.TotalSeconds,1))s"

      - name: Verify openclaw CLI
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          wsl -d Ubuntu-24.04 -u openclaw -- /opt/openclaw/bin/openclaw --version
          if ($LASTEXITCODE -ne 0) { throw "openclaw --version failed with $LASTEXITCODE" }
          wsl -d Ubuntu-24.04 -u openclaw -- /opt/openclaw/bin/openclaw --help | Select-Object -First 40

      - name: Start fake LLM server inside WSL
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $script = ConvertTo-WslPath (Join-Path $env:GITHUB_WORKSPACE "tools/spike/start-fake-llm.sh")
          $repoWsl = ConvertTo-WslPath $env:GITHUB_WORKSPACE
          $port = $env:FAKE_LLM_PORT
          wsl -d Ubuntu-24.04 -u openclaw -- bash -lc "REPO_WSL_PATH='$repoWsl' FAKE_LLM_PORT='$port' bash $script"
          if ($LASTEXITCODE -ne 0) { throw "fake-llm bring-up failed with $LASTEXITCODE" }

      - name: Configure openclaw to use fake LLM and validate
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $script = ConvertTo-WslPath (Join-Path $env:GITHUB_WORKSPACE "tools/spike/config-probe.sh")
          $port = $env:FAKE_LLM_PORT
          wsl -d Ubuntu-24.04 -u openclaw -- bash -lc "FAKE_LLM_PORT='$port' bash $script" | Tee-Object -FilePath openclaw-config-spike.log
          # We do NOT fail the job here even if validate exits non-zero; the whole point
          # of the spike is to record the actual config shape so we can correct the
          # production harness before W3 work begins.

      - name: Collect server log
        if: always()
        shell: pwsh
        run: |
          Write-Host "::group::fake-llm server.log"
          wsl -d Ubuntu-24.04 -u openclaw -- cat /home/openclaw/fake-llm/server.log
          Write-Host "::endgroup::"

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gateway-compat-spike
          path: |
            openclaw-config-spike.log
            openclaw-schema.json
          if-no-files-found: warn

      - name: Cleanup distro
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          wsl --shutdown
          wsl --unregister Ubuntu-24.04
